<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UnReact.js - Modern Framework by Arnav Joshi</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <p>BTW this HTML page has nothing to do with the framework<br>It's just testin</p>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="app/globals.css">
</head>
<body>
    <div id="root"></div>
    <script type="module">
        import { createComponent } from './src/index.js';
        import { RootLayout } from './app/layout.js';
        import { HomePage } from './app/page.js';

        const App = createComponent(() => {
            return RootLayout({
                title: 'UnReact.js - Modern Framework',
                children: HomePage({})
            });
        });

        document.getElementById('root').appendChild(App({}));
    </script>
</body>
